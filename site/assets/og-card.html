<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>og card</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px; height: 630px;
    background: #0a0c10;
    font-family: 'Inter', sans-serif;
    color: #e9eef6;
    overflow: hidden;
    position: relative;
  }
  .glow {
    position: absolute; top: -40%; left: 50%;
    width: 1600px; height: 1600px;
    transform: translateX(-50%);
    background:
      radial-gradient(circle at 32% 38%, rgb(83 224 166 / .20), transparent 55%),
      radial-gradient(circle at 70% 32%, rgb(157 123 255 / .18), transparent 57%),
      radial-gradient(circle at 52% 64%, rgb(76 201 240 / .13), transparent 60%);
    filter: blur(30px);
  }
  .inner { position: relative; padding: 72px 80px; height: 100%; display: flex; flex-direction: column; }
  .brand { display: flex; align-items: center; gap: 16px; margin-bottom: 44px; }
  .mark { width: 54px; height: 54px; }
  .mark rect { fill: rgb(255 255 255 / .06); stroke: #1d2430; stroke-width: 1; }
  .mark path { fill: none; stroke: #53e0a6; stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; }
  .name { font-size: 34px; font-weight: 800; letter-spacing: -.02em; }
  h1 { font-size: 66px; font-weight: 800; line-height: 1.08; letter-spacing: -.03em; margin-bottom: 26px; }
  .grad {
    background: linear-gradient(100deg, #53e0a6, #4cc9f0 46%, #9d7bff);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  p.lede { font-size: 27px; line-height: 1.5; color: #a6b2c4; max-width: 24ch; }
  .pills { margin-top: auto; display: flex; gap: 12px; }
  .pill {
    font-family: 'JetBrains Mono', monospace;
    font-size: 19px; font-weight: 500;
    color: #a6b2c4;
    background: rgb(255 255 255 / .05);
    border: 1px solid #1d2430;
    border-radius: 999px;
    padding: 11px 22px;
  }
  .cert {
    position: absolute; right: 80px; top: 180px;
    width: 400px;
    background: #080a0e;
    border: 1px solid #1d2430;
    border-radius: 18px;
    padding: 26px 30px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 18px;
    line-height: 2.1;
    color: #6f7d91;
  }
  .cert .row b { color: #e9eef6; font-weight: 500; }
  .cert .ok { color: #53e0a6; }
  /* Needs to match `.cert .row b` specificity to win — the red NaN is the point. */
  .cert .row b.bad { color: #ff7a8a; }
  .cert .hd {
    color: #e9eef6; font-weight: 700; font-size: 16px;
    letter-spacing: .09em; text-transform: uppercase;
    margin-bottom: 10px;
  }
</style>
</head>
<body>
<div class="glow"></div>
<div class="inner">
  <div class="brand">
    <svg class="mark" viewBox="0 0 32 32"><rect width="32" height="32" rx="9"/><path d="M9 16.5l4.2 4.2L23 11"/></svg>
    <span class="name">Buggy</span>
  </div>

  <h1>Most tools guess.<br><span class="grad">Buggy proves.</span></h1>
  <p class="lede">A debugger that executes your code to find the input that breaks it.</p>

  <div class="pills">
    <span class="pill">proof certificates</span>
    <span class="pill">overfit rejection</span>
    <span class="pill">TS + Python</span>
  </div>
</div>

<div class="cert">
  <div class="hd">Certificate</div>
  <div class="row">input &nbsp;<b>[0, 0]</b></div>
  <div class="row">output <b class="bad">NaN</b></div>
  <div class="row"><span class="ok">✓</span> admissible</div>
  <div class="row"><span class="ok">✓</span> sound</div>
  <div class="row"><span class="ok">✓</span> reproducible</div>
</div>
</body>
</html>
