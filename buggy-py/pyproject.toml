[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "buggy"
version = "0.1.0.dev0"
description = "Proof-carrying debugging for Python: finds a real failing input, verifies it three ways, and hands back a certificate."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["debugging", "bug-detection", "fuzzing", "property-testing", "static-analysis"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Debuggers",
  "Topic :: Software Development :: Testing",
]

# No runtime dependencies, on purpose. Everything here is standard library, so
# the package installs on any supported Python without waiting for a wheel -
# including 3.15, where several popular packages have none yet. It also means
# the tool cannot break the environment of the project it is inspecting.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
buggy = "buggy.cli:main"
buggy-mcp = "buggy.mcp:main"

[tool.setuptools.packages.find]
include = ["buggy*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
