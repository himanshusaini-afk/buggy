# Buggy Configuration
# ──────────────────────────────────────────────────────────────
# This file configures the proof-carrying debugger for your project.
# Place this file at your project root as `.debugger.yaml`.
#
# Generated by: buggy init
# Documentation: https://github.com/buggy/docs

version: "1.0"

# ─── Language ─────────────────────────────────────────────────
# Primary language of the project. Used for parser and LSP selection.
# Supported: typescript, javascript, python, rust, go, java, c, cpp
language: typescript

# ─── Parser ───────────────────────────────────────────────────
# Tree-sitter parser configuration for CST generation.
parser:
  # Parser command or grammar identifier.
  # Built-in: tree-sitter-typescript, tree-sitter-javascript, tree-sitter-python
  command: tree-sitter-typescript
  # Optional path to a custom .wasm grammar file:
  # grammar_path: ./grammars/custom-lang.wasm

# ─── LSP ──────────────────────────────────────────────────────
# Language Server Protocol client for symbol resolution and type info.
lsp:
  # LSP server command. Common choices:
  #   TypeScript: typescript-language-server
  #   Python:     pylsp or pyright
  #   Rust:       rust-analyzer
  #   Go:         gopls
  command: typescript-language-server
  # Additional initialization options passed to the LSP server:
  # initialization_options:
  #   preferences:
  #     includeInlayParameterNameHints: "all"

# ─── Sandbox ──────────────────────────────────────────────────
# Isolated execution environment for running tests and fuzzing.
sandbox:
  # Runtime to use for execution (node, python, deno, bun)
  runtime: node
  # Maximum memory allocation per sandbox instance (MB)
  memory_limit_mb: 512
  # Maximum execution time per sandbox run (seconds)
  timeout_seconds: 60
  # Network policy: 'deny' blocks all egress, 'allow_host_only' permits localhost
  egress_policy: deny

# ─── Oracles ──────────────────────────────────────────────────
# Violation detectors that identify bugs during execution.
oracles:
  # Timeout detection threshold (seconds). Executions exceeding this
  # are flagged as potential infinite loops or performance bugs.
  timeout_threshold_seconds: 10
  # Enable crash (uncaught exception) detection
  crash_detection: true
  # Enable integer/buffer overflow detection
  overflow_detection: true
  # Number of executions to compare for determinism checking.
  # Higher values increase confidence but slow down analysis.
  determinism_check_count: 5

# ─── PROBE Loop ───────────────────────────────────────────────
# Property-based Refinement of Observed Behavior Engine.
# Iteratively refines function specifications through counterexample search.
probe:
  # Maximum number of property candidates to explore
  search_budget: 100
  # Maximum iterations for refining a single property
  max_refinement_iterations: 10

# ─── Plugs (Optional) ────────────────────────────────────────
# Custom plug-ins to override default agent behavior.
# Each plug is a path to a module exporting the required interface.
#
# plugs:
#   # Custom parser plug (implements ParsingPlug interface)
#   parsing: ./plugs/my-custom-parser
#
#   # Additional oracle plugs (implements OraclePlug interface)
#   oracles:
#     - ./plugs/memory-leak-oracle
#     - ./plugs/concurrency-oracle
#
#   # Custom repair strategy (implements RepairPlug interface)
#   repair: ./plugs/ml-based-repair
#
#   # Custom sandbox executor (implements SandboxExecutorPlug interface)
#   sandbox_executor: ./plugs/docker-sandbox
