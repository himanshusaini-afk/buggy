# Buggy Configuration
# Generated by: buggy init
#
# Regenerate at any time with: buggy init --force

# Selects BOTH the Tree-sitter grammar and the execution runtime used to prove
# bugs. Change this if the project's primary language changes.
language: python

parser:
  command: tree-sitter-python
  # grammar_path: ./path/to/custom-grammar.wasm

lsp:
  command: pylsp
  # initialization_options: {}

sandbox:
  runtime: python
  memory_limit_mb: 512
  timeout_seconds: 60
  egress_policy: deny

oracles:
  # A function running longer than this is reported as a hang (catches infinite loops).
  timeout_threshold_seconds: 5
  crash_detection: true
  overflow_detection: true
  # Each check re-runs the function in a fresh process to confirm the result is
  # deterministic. Every run costs a python process spawn, so this multiplies the
  # cost of the whole search. 5 is the wizard default; 2 keeps this demo brisk.
  determinism_check_count: 2

probe:
  # Tuned DOWN from the wizard's "balanced" default of 100.
  #
  # Cost is asymmetric: a function WITH a bug stops at the first failing input
  # (~1 attempt), but a CLEAN function burns the whole budget before it can report
  # "unconfirmed". At budget 100 the three clean functions here took 200-250s
  # each. At 20 the buggy ones are still caught immediately and the run finishes
  # in about a minute. Raise it when hunting hard-to-reach bugs.
  search_budget: 20
  max_refinement_iterations: 5

watchlist:
  enabled: true
  # local  = private to you (.debugger/, git-ignored)
  # team   = committed lessons in .kiro/steering/ (shared with the repo)
  # global = reused across all your projects (sanitized)
  # layered = all of the above
  #
  # This example uses "team" rather than the wizard's "layered" default so the run
  # stays self-contained: nothing is written to your home directory.
  scope: team

